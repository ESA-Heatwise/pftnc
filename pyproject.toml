[project]
authors = [
    {name = "Yogesh Kumar Baljeet Singh", email = "yogesh.baljeetsingh@brockmann-consult.de"},
    {name = "Marcel Koenig", email = "marcel.koenig@brockmann-consult.de"},
    {name = "Udit Asopa"},
    {name = "Hannes Neuschmidt", email = "hannes.neuschmidt@brockmann-consult.de"},
]
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
    "typer>=0.23.0,<0.24",
    "mlflow>=3.9.0,<4",
    "psycopg2-binary>=2.9.10,<3",
    "asyncpg>=0.31.0,<0.32",
    "tqdm>=4.66,<5",
    "xgboost>=3.2.0,<4",
    "optuna>=4.7.0,<5",
    "shap>=0.50.0,<0.51",
]
name = "pftnc"
requires-python = ">= 3.11"
version = "0.1.1"
description = "Predicts PFT from simulated CHIME, LSTM, S2 and S3 data via radiometric transfer simulations"

[project.urls]
Homepage = "Update your homepage here"
Repository = "Update your repository here"

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.10,<3",
    "asyncpg>=0.31.0,<0.32",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
pftnc = { path = ".", editable = true }

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]


[tool.pixi.tasks.format]
depends-on = [
    "format-isort",
    "format-ruff",
    "fix-ruff"
]

[tool.pixi.tasks.format-ruff]
cmd = "ruff format src tests"

[tool.pixi.tasks.fix-ruff]
cmd = "ruff check src tests --fix"

[tool.pixi.tasks.format-check]
cmd = "ruff format --check src tests"

[tool.pixi.tasks.format-isort]
cmd = "isort src tests"

[tool.pixi.tasks.lint]
depends-on = [
    "lint-ruff",
    "lint-mypy",
]

[tool.pixi.tasks.lint-ruff]
cmd = "ruff check --fix src tests"

[tool.pixi.tasks.lint-mypy]
cmd = "mypy src"

[tool.pixi.tasks.tests]
cmd = "pytest --cov src/pftnc --cov-report=html"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]

[tool.pixi.dependencies]
python = ">3.10,<=3.13"
# required
typer = ">=0.23.0,<0.24"
# mlops
mlflow = ">=3.9.0,<4"
psycopg2-binary = ">=2.9.10,<3"
asyncpg = ">=0.31.0,<0.32"
jupyter = ">=1.1.1,<2"
xgboost = ">=3.2.0,<4"
optuna = ">=4.7.0,<5"
shap = ">=0.50.0,<0.51"
# development dependencies
pytest-cov = ">=7.0.0,<8"
pytest = ">=9.0.2,<10"
ruff = ">=0.15.0,<0.16"
isort = ">=7.0.0,<8"
pip = ">=26.0.1,<27"
mypy = "*"

[tool.hatch.build]
sources = ["src"]
include = [
  "src/pftnc/**/*"
]
artifacts = [
  "src/pftnc/config/*.yml"
]

[tool.hatch.build.targets.wheel]
packages = ["src/pftnc"]

[tool.hatch.build.targets.sdist]
include = [
  "src/pftnc/**/*",
  "pyproject.toml",
  "README.md"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]


[project.scripts]
pftnc = "pftnc.cli:app"
