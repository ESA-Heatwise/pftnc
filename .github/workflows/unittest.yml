name: Unittest pftnc

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  Python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py311, py312, py313]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: latest
          cache: true
          environments: ${{ matrix.environment }}

      - name: Install environment
        run: pixi install
      
      - name: Check formatting
        run: pixi run format-check

      - name: Check linting
        run: pixi run lint

      - name: Run unit tests
        run: pixi run pytest --cov=pftnc --cov-report=xml
